<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Gerados a partir de logo_alt.png, recortados e centrados num quadrado:
         a arte é 499x603, e o navegador achataria se usada direto. O de 32px é
         o que aparece na aba; os maiores servem retina, atalho e PWA. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Estas tags são o estado INICIAL, valendo para a home e para quem lê o
         HTML sem executar JavaScript. Cada rota reescreve título, descrição,
         canonical e Open Graph em tempo de execução — ver src/utils/seo.js.

         Note que NÃO há <link rel="canonical"> aqui: como o mesmo arquivo serve
         todas as rotas, um canonical fixo apontando para a home mandaria o
         Google desindexar as vitrines dos clientes. Ele é escrito por rota. -->
    <title>Omnimob — Sua imobiliária, em movimento.</title>
    <meta
      name="description"
      content="Software para imobiliárias e corretores: cadastro de imóveis, vitrine digital personalizável, captação e gestão de leads e publicação nas redes sociais."
    />
    <meta name="robots" content="index,follow" />
    <meta name="author" content="Omnimob" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Omnimob" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://omnimob.app/" />
    <meta property="og:title" content="Omnimob — CRM e gestão imobiliária com vitrine digital" />
    <meta
      property="og:description"
      content="Do cadastro do imóvel ao lead fechado, num só lugar. Vitrine sem escrever código, captação de leads e publicação nas redes."
    />
    <!-- 1200x630: proporção que Facebook, LinkedIn e WhatsApp esperam. O
         logo.png antigo era retrato (499x603) e era recortado nas laterais. -->
    <meta property="og:image" content="https://omnimob.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Omnimob — CRM e gestão imobiliária com vitrine digital" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Omnimob — CRM e gestão imobiliária com vitrine digital" />
    <meta
      name="twitter:description"
      content="Do cadastro do imóvel ao lead fechado, num só lugar."
    />
    <meta name="twitter:image" content="https://omnimob.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- As duas origens que toda vitrine visita antes da primeira foto: a API
         (os dados da página) e o Cloudinary (as fotos). Abrir a conexão agora
         adianta o DNS e o TLS, que no 4G passam de meio segundo cada. -->
    <link rel="preconnect" href="https://api.omnimob.app" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- A fonte NÃO segura a pintura: `media="print"` faz o navegador baixá-la
         sem bloquear, e o `onload` a liga quando chegar. Com `display=swap` ela
         já trocaria de qualquer jeito; o que este truque tira é a espera da
         FOLHA de estilo do Google, que o PageSpeed contava como bloqueio de
         ~1 s no celular. Sem JavaScript, o <noscript> carrega do jeito antigo. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- Dados estruturados. Ficam no HTML (e não no JS) porque é o único
         conteúdo desta página que existe antes da renderização — o Google lê
         mesmo se abandonar a fila de renderização.

         Os preços são os mesmos publicados na landing. O PREMIUM é "sob
         consulta", então só o piso entra: `lowPrice` sem `highPrice` é a
         forma correta de declarar "a partir de". -->
    <!-- O JSON-LD da Omnimob (Organization/WebSite/SoftwareApplication) saiu
         daqui: este HTML serve TODAS as rotas, inclusive as vitrines dos
         clientes — e ali dizia ao Google que a página era da Omnimob. Hoje ele
         é injetado só na landing e nas páginas institucionais, por
         `utils/esquemaDaOmnimob.js`. -->
    <!-- Telas centradas ou em largura total (aba "Painel" das Configurações),
         decidido ANTES da primeira pintura — sem isto o painel abriria em
         largura total e pularia para o centro um instante depois. A ordem é a
         do VYA, menos o servidor, que aqui só chega com a sessão: a cópia do
         navegador e, sem ela, o automático (centrado a partir de 1800px). O
         CSS só lê o atributo dentro do painel; a vitrine e a landing não o
         veem. Ver `utils/layoutCentrado.js` — a chave e o limite são os de lá. -->
    <script>
      (function () {
        var r = document.documentElement, v = null;
        try { var s = localStorage.getItem("layoutCentrado"); if (s === "1") v = true; else if (s === "0") v = false; } catch (e) {}
        if (v === null) v = (window.innerWidth || 0) >= 1800;
        if (v) r.setAttribute("data-layout", "centrado"); else r.removeAttribute("data-layout");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- ── A busca adiantada da vitrine ───────────────────────────────────────
         A vitrine não desenha nada antes dos dados da API, e a API só era
         chamada depois de o pacote de JavaScript descer e rodar: as duas esperas
         em FILA. No 4G do PageSpeed, quase um segundo de pacote antes de a busca
         sequer começar.

         Este script é síncrono e minúsculo de propósito: lê o endereço, e se for
         uma vitrine (`/vitrine/<slug>` ou `<slug>.omnimob.app`) dispara as mesmas
         buscas que a página faria, guardando as promessas em
         `window.__buscaAdiantada`. O `request()` de `src/api.js` as recolhe —
         a tela continua sendo quem trata erro e resposta. Fora da vitrine não faz
         nada; no domínio próprio da imobiliária também não (o slug só se sabe
         perguntando à API, e é esse caminho que a página já faz).

         Sem cabeçalho nenhum, como o `request()` faz nas leituras: cabeçalho
         extra obrigaria um OPTIONS antes de cada busca. A lista de subdomínios
         reservados espelha `utils/dominioVitrine.js`. -->
    <script>
      (function () {
        try {
          var api = "%VITE_API_URL%";
          if (api.charAt(0) === "%") api = "https://api.omnimob.app";
          api = api.replace(/\/+$/, "");
          var host = location.hostname.toLowerCase();
          var caminho = location.pathname;
          var slug = null;
          var m = caminho.match(/^\/vitrine\/([^/]+)(\/.*)?$/);
          if (m) {
            slug = m[1];
            caminho = m[2] || "/";
          } else {
            var s = host.match(/^([^.]+)\.omnimob\.app$/);
            if (s && !/^(www|api|app|admin|painel|static|cdn|mail)$/.test(s[1])) slug = s[1];
          }
          if (!slug || caminho.indexOf("/editar") === 0) return;
          var buscas = ["/public/" + slug + "/properties"];
          var imovel = caminho.match(/^\/imovel\/([^/]+)/);
          if (imovel) buscas.push("/public/" + slug + "/properties/" + imovel[1]);
          var adiantadas = (window.__buscaAdiantada = {});
          buscas.forEach(function (b) { adiantadas[b] = fetch(api + b); });
        } catch (e) { /* sem adiantamento, a página busca sozinha */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
