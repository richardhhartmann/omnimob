    <!-- Estas tags são o estado INICIAL, valendo para a home e para quem lê o
         HTML sem executar JavaScript. Cada rota reescreve título, descrição,
         canonical e Open Graph em tempo de execução — ver src/utils/seo.js.

         Note que NÃO há <link rel="canonical"> aqui: como o mesmo arquivo serve
         todas as rotas, um canonical fixo apontando para a home mandaria o
         Google desindexar as vitrines dos clientes. Ele é escrito por rota. -->

    <meta
      name="description"
      content="Software para imobiliárias e corretores: cadastro de imóveis, vitrine digital personalizável, captação e gestão de leads e publicação nas redes sociais."
    />

         logo.png antigo era retrato (499x603) e era recortado nas laterais. -->
